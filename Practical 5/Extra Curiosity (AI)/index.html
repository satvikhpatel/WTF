<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityCare Hospital - Patient Registration</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <main class="page">
    <div class="card-scene">
    <div class="card-flip" id="cardFlip">
    <section class="card-face container" id="registerFace">
        <div class="title">
        
        <h1><i class="fa-solid fa-notes-medical"></i> CityCare Hospital</h1>
        <h5><i class="fa-solid fa-location-dot"></i> Anand, Gujarat, India</h5>
        <h2><i class="fa-solid fa-person"></i> New Patient Registration</h2>
        </div>

        <form id="registrationForm" novalidate>
            <div class="form-group">
                <label for="fullName"><i class="fa-solid fa-user"></i> Full Name *</label>
                <input type="text" id="fullName" placeholder="Enter your full name" maxlength="50" required>
                <span class="error" id="nameError"></span>
            </div>

            <div class="form-group">
                <label for="email"><i class="fa-solid fa-envelope"></i> Email Address *</label>
                <input type="email" id="email" placeholder="example@email.com" maxlength="100" required>
                <span class="error" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="mobile"><i class="fa-solid fa-phone"></i> Mobile Number *</label>
                <input type="tel" id="mobile" placeholder="Enter 10-digit mobile number" maxlength="10" required>
                <span class="error" id="mobileError"></span>
            </div>

            <div class="form-group">
                <label for="dob"><i class="fa-solid fa-calendar"></i> Date of Birth *</label>
                <input type="date" id="dob" required>
                <span class="error" id="dobError"></span>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-venus-mars"></i> Gender *</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="Male"> Male</label>
                    <label><input type="radio" name="gender" value="Female"> Female</label>
                    <label><input type="radio" name="gender" value="Other"> Other</label>
                </div>
                <span class="error" id="genderError"></span>
            </div>

            <div class="form-group">
                <label for="bloodGroup"><i class="fa-solid fa-droplet"></i> Blood Group *</label>
                <select id="bloodGroup" required>
                    <option value="">-- Select Blood Group --</option>
                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                    <option>O+</option>
                    <option>O-</option>
                </select>
                <span class="error" id="bloodError"></span>
            </div>

            <div class="form-group">
                <label for="address"><i class="fa-solid fa-house"></i> Address *</label>
                <textarea id="address" placeholder="Enter your address" maxlength="200" required></textarea>
                <span class="error" id="addressError"></span>
            </div>

            <div class="form-group">
                <label for="password"><i class="fa-solid fa-lock"></i> Password *</label>
                <div class="password-input-wrapper">
                    <input type="password" id="password" placeholder="Enter password" minlength="8" maxlength="30" required>
                    <button type="button" class="toggle-pass" id="togglePassword">
                        <i class="fa-solid fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
                    <div class="strength" id="passwordStrength"></div>
                    <span class="error" id="passwordError"></span>
            </div>

            <div class="form-group">
                <label for="confirmPassword"><i class="fa-solid fa-key"></i> Confirm Password *</label>
                <div class="password-input-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
                    <button type="button" class="toggle-pass" id="toggleConfirmPassword">
                        <i class="fa-solid fa-eye" id="confirmEyeIcon"></i>
                    </button>
                </div>
                <span class="error" id="confirmPasswordError"></span>
            </div>

            <div class="form-group file-group">
                <label for="document"><i class="fa-solid fa-file"></i> Upload ID Proof</label>
                <input type="file" id="document" accept=".jpg,.jpeg,.png,.pdf">
                <span class="error" id="fileError"></span>
            </div>

            <div class="form-group checkbox-group">
                <label><input type="checkbox" id="terms"> I confirm that the information provided is correct.</label>
            </div>
            <span class="error" id="termsError"></span>
            <h4>* indicates mandatory fields.</h4>
            <br>
            <p class="switch-line">Already Registered? <button type="button" class="link-btn" data-flip>Log in</button></p>
            <div class="buttonAlign">
            <button type="reset">Reset</button>
            <button type="submit">Register Patient</button>
            </div>
            <div class="success-message" id="successMessage"></div>
        </form>
    </section>

    <section class="card-face container card-back" id="loginFace" inert>
        <div class="title">
            <h1><i class="fa-solid fa-notes-medical"></i> CityCare Hospital</h1>
            <h5><i class="fa-solid fa-location-dot"></i> Anand, Gujarat, India</h5>
            <h2><i class="fa-solid fa-right-to-bracket"></i> Patient Login</h2>
        </div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="loginEmail"><i class="fa-solid fa-envelope"></i> Email Address *</label>
                <input type="email" id="loginEmail" placeholder="example@email.com" maxlength="100" required>
                <span class="error" id="loginEmailError"></span>
            </div>

            <div class="form-group">
                <label for="loginPassword"><i class="fa-solid fa-lock"></i> Password *</label>
                <div class="password-input-wrapper">
                    <input type="password" id="loginPassword" placeholder="Enter your password" maxlength="30" required>
                    <button type="button" class="toggle-pass" id="toggleLoginPassword">
                        <i class="fa-solid fa-eye" id="loginEyeIcon"></i>
                    </button>
                </div>
                <span class="error" id="loginPasswordError"></span>
            </div>

            <p class="switch-line">New here? <button type="button" class="link-btn" data-flip>Sign Up</button></p>
            <button type="submit">Log In</button>
            <div class="success-message" id="loginSuccess"></div>
        </form>
    </section>
    </div>
    </div>

    <aside class="scene-panel" aria-hidden="true">
    <svg class="hospital-scene" viewBox="0 0 500 520" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aeeaff"/><stop offset="1" stop-color="#ffe3f1"/></linearGradient>
            <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffde7"/><stop offset="1" stop-color="#ffe0b2"/></linearGradient>

            <!-- Sick patient: bandage, tired eyes, frown -->
            <g id="sick">
                <ellipse cx="0" cy="1" rx="16" ry="3.5" fill="#000" opacity=".12"/>
                <g class="bob">
                    <rect class="leg l pants" x="-9" y="-34" width="7" height="34" rx="3.5"/>
                    <rect class="leg r pants" x="2" y="-34" width="7" height="34" rx="3.5"/>
                    <rect class="skin" x="-19" y="-62" width="7" height="26" rx="3.5"/>
                    <rect class="skin" x="12" y="-62" width="7" height="26" rx="3.5"/>
                    <rect class="shirt" x="-14" y="-64" width="28" height="34" rx="11"/>
                    <circle class="skin" cx="0" cy="-76" r="13"/>
                    <path class="hair" d="M-13.5 -77 A13.5 13.5 0 0 1 13.5 -77 Q0 -83 -13.5 -77Z"/>
                    <rect x="2" y="-90" width="13" height="6" rx="2" fill="#fff" stroke="#e57373" transform="rotate(-18 8 -87)"/>
                    <path d="M-7 -77 h4 M3 -77 h4" stroke="#37474f" stroke-width="1.6" stroke-linecap="round"/>
                    <path d="M-4 -67 Q0 -71 4 -67" stroke="#37474f" stroke-width="1.6" fill="none" stroke-linecap="round"/>
                    <path d="M14 -80 q3 5 0 7 q-3 -2 0 -7z" fill="#4fc3f7"/>
                </g>
            </g>

            <!-- Happy patient: big smile, rosy cheeks, waving, floating heart -->
            <g id="happy">
                <ellipse cx="0" cy="1" rx="16" ry="3.5" fill="#000" opacity=".12"/>
                <g class="bob hop">
                    <rect class="leg l pants" x="-9" y="-34" width="7" height="34" rx="3.5"/>
                    <rect class="leg r pants" x="2" y="-34" width="7" height="34" rx="3.5"/>
                    <rect class="skin" x="-19" y="-62" width="7" height="26" rx="3.5"/>
                    <rect class="skin wave" x="12" y="-62" width="7" height="26" rx="3.5"/>
                    <rect class="shirt" x="-14" y="-64" width="28" height="34" rx="11"/>
                    <circle class="skin" cx="0" cy="-76" r="13"/>
                    <path class="hair" d="M-13.5 -77 A13.5 13.5 0 0 1 13.5 -77 Q0 -83 -13.5 -77Z"/>
                    <circle cx="-8" cy="-72" r="3" fill="#ff8a80" opacity=".6"/>
                    <circle cx="8" cy="-72" r="3" fill="#ff8a80" opacity=".6"/>
                    <path d="M-7 -77 q2 -3 4 0 M3 -77 q2 -3 4 0" stroke="#37474f" stroke-width="1.6" fill="none" stroke-linecap="round"/>
                    <path d="M-5 -70 Q0 -62 5 -70Z" fill="#e53935"/>
                    <g transform="translate(0 -108)"><path class="float-heart" d="M0 6 C-14 -4 -8 -14 0 -6 C8 -14 14 -4 0 6Z" fill="#ff4081"/></g>
                </g>
            </g>
        </defs>

        <!-- sky, sun, clouds -->
        <rect width="500" height="520" fill="url(#sky)"/>
        <circle class="sun-ring" cx="430" cy="70" r="34" fill="none" stroke="#ffd54f" stroke-width="6" stroke-dasharray="4 10" stroke-linecap="round"/>
        <circle cx="430" cy="70" r="24" fill="#ffe082"/>
        <g transform="translate(0 60)"><g class="cloud" fill="#fff" opacity=".9"><ellipse cx="0" cy="0" rx="34" ry="12"/><circle cx="-8" cy="-10" r="12"/><circle cx="12" cy="-13" r="15"/></g></g>
        <g transform="translate(0 115) scale(.75)"><g class="cloud c2" fill="#fff" opacity=".85"><ellipse cx="0" cy="0" rx="34" ry="12"/><circle cx="-8" cy="-10" r="12"/><circle cx="12" cy="-13" r="15"/></g></g>
        <rect y="412" width="500" height="18" fill="#a5d6a7"/>

        <!-- trees -->
        <g class="tree"><rect x="41" y="370" width="8" height="46" fill="#8d6e63"/><circle cx="45" cy="352" r="30" fill="#81c784"/><circle cx="28" cy="376" r="20" fill="#66bb6a"/><circle cx="63" cy="374" r="20" fill="#66bb6a"/></g>
        <g class="tree t2"><rect x="451" y="370" width="8" height="46" fill="#8d6e63"/><circle cx="455" cy="352" r="30" fill="#81c784"/><circle cx="438" cy="376" r="20" fill="#66bb6a"/><circle cx="473" cy="374" r="20" fill="#66bb6a"/></g>

        <!-- hospital building -->
        <rect x="96" y="158" width="308" height="22" rx="6" fill="#1565c0"/>
        <rect x="110" y="180" width="280" height="250" fill="#f3fbff" stroke="#90caf9" stroke-width="2"/>
        <circle cx="250" cy="128" r="34" fill="#fff" stroke="#1565c0" stroke-width="5"/>
        <rect x="244" y="108" width="12" height="40" rx="2" fill="#e53935"/>
        <rect x="230" y="122" width="40" height="12" rx="2" fill="#e53935"/>
        <g>
            <rect class="win" x="124" y="198" width="28" height="30" rx="4"/><rect class="win" x="162" y="198" width="28" height="30" rx="4"/>
            <rect class="win" x="310" y="198" width="28" height="30" rx="4"/><rect class="win" x="348" y="198" width="28" height="30" rx="4"/>
            <rect class="win" x="124" y="244" width="28" height="30" rx="4"/><rect class="win" x="162" y="244" width="28" height="30" rx="4"/>
            <rect class="win" x="310" y="244" width="28" height="30" rx="4"/><rect class="win" x="348" y="244" width="28" height="30" rx="4"/>
            <rect class="win" x="124" y="346" width="28" height="30" rx="4"/><rect class="win" x="162" y="346" width="28" height="30" rx="4"/>
            <rect class="win" x="310" y="346" width="28" height="30" rx="4"/><rect class="win" x="348" y="346" width="28" height="30" rx="4"/>
        </g>
        <rect x="165" y="290" width="170" height="24" rx="6" fill="#1565c0"/>
        <text x="250" y="307" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" letter-spacing="1.5" style="font-family:'Gill Sans',Calibri,sans-serif">CITYCARE HOSPITAL</text>
        <rect x="200" y="322" width="100" height="12" rx="3" fill="#1565c0"/>
        <rect x="215" y="334" width="70" height="96" fill="url(#glow)"/>
        <rect x="215" y="334" width="14" height="96" fill="#81d4fa" opacity=".75" stroke="#4fc3f7"/>
        <rect x="271" y="334" width="14" height="96" fill="#81d4fa" opacity=".75" stroke="#4fc3f7"/>

        <!-- plaza -->
        <rect y="430" width="500" height="90" fill="#e3edf2"/>
        <rect y="430" width="500" height="4" fill="#cfd8dc"/>

        <!-- patients arriving (left to right, into the door) -->
        <g transform="translate(0 446)"><g class="walker in" style="--delay:-1s"><use href="#sick" style="--shirt:#ffab91;--pants:#5c6bc0;--hair:#4e342e;--skin:#f1c9a5"/></g></g>
        <g transform="translate(0 462)"><g class="walker in" style="--delay:-5s"><use href="#sick" style="--shirt:#b39ddb;--pants:#455a64;--hair:#212121;--skin:#e0ac84"/></g></g>
        <g transform="translate(0 454)"><g class="walker in" style="--delay:-9s"><use href="#sick" style="--shirt:#80cbc4;--pants:#6d4c41;--hair:#8d6e63;--skin:#ffdbb5"/></g></g>

        <!-- happy patients leaving (door to the right) -->
        <g transform="translate(0 470)"><g class="walker out" style="--delay:-3s"><use href="#happy" style="--shirt:#ffcc80;--pants:#3949ab;--hair:#5d4037;--skin:#f1c9a5"/></g></g>
        <g transform="translate(0 458)"><g class="walker out" style="--delay:-7s"><use href="#happy" style="--shirt:#f48fb1;--pants:#37474f;--hair:#212121;--skin:#c68642"/></g></g>
        <g transform="translate(0 466)"><g class="walker out" style="--delay:-10.5s"><use href="#happy" style="--shirt:#90caf9;--pants:#00897b;--hair:#6d4c41;--skin:#ffdbb5"/></g></g>
    </svg>
    <p class="scene-caption">Caring for every patient, every day.</p>
    </aside>
    </main>

    <script src="script.js"></script>
</body>
</html>
